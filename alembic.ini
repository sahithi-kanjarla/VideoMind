# Alembic Configuration File

[alembic]
# path to migration scripts
script_location = alembic

# template to use to generate migration file name; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the "revision" metadata, use the value of
# timezone_impl.utcnow() in the env.py file.
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's munged from the "rev" and filename.
# set to 0 to disable, omitting this setting is equivalent to 9
# max_identifier_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a .py source file
# to be treated as revisions in the versions/ directory
# allow_partial_revision = false

# set to 'true' to compare type and non-type comparable elements as unequal types (it is just/)
# the default is 'false'
# compare_type = false

# compare server_default for migrations, defaults to false
# the default is 'false'
compare_server_default=true

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
